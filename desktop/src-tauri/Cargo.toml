[package]
name = "meetguide-desktop"
version = "0.1.0"
description = "MeetGuide AI desktop companion foundation"
edition = "2021"

[lib]
name = "meetguide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
url = "2"
webbrowser = "1"
zeroize = "1"

# Session-local streaming audio transport and conversion (no provider credentials here).
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rubato = "0.16"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"

windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_UI_WindowsAndMessaging"] }
